<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Extractor - MIDA Project</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border: none;
            border-radius: 10px;
        }
        .btn-primary {
            background: linear-gradient(45deg, #007bff, #0056b3);
            border: none;
            border-radius: 25px;
            padding: 10px 30px;
        }
        .stats-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .confidence-high { color: #28a745; }
        .confidence-medium { color: #ffc107; }
        .confidence-low { color: #dc3545; }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid py-4">
        <div class="row">
            <div class="col-12">
                <div class="card mb-4">
                    <div class="card-body text-center">
                        <h1 class="display-4 mb-3">
                            <i class="fas fa-file-pdf text-primary"></i>
                            PDF Extractor
                        </h1>
                        <p class="lead text-muted">Sistema intelligente di estrazione dati dai PDF per il progetto MIDA</p>
                        
                        <div class="row mt-4">
                            <div class="col-md-6">
                                <button id="extractBtn" class="btn btn-primary btn-lg">
                                    <i class="fas fa-magic"></i> Estrai Dati dai PDF
                                </button>
                            </div>
                            <div class="col-md-6">
                                <a href="/results" class="btn btn-outline-primary btn-lg">
                                    <i class="fas fa-chart-bar"></i> Visualizza Risultati
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loadingSpinner" class="text-center d-none">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Caricamento...</span>
            </div>
            <p class="mt-2">Estrazione in corso...</p>
        </div>

        <!-- Results Overview -->
        <div id="resultsOverview" class="row d-none">
            <div class="col-12">
                <h3 class="mb-4">Risultati Estrazione</h3>
            </div>
            
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-file-pdf fa-2x mb-2"></i>
                        <h4 id="filesProcessed">0</h4>
                        <p class="mb-0">File Processati</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-flag fa-2x mb-2"></i>
                        <h4 id="totalMissions">0</h4>
                        <p class="mb-0">Missioni Trovate</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-users fa-2x mb-2"></i>
                        <h4 id="totalPersonnel">0</h4>
                        <p class="mb-0">Personale Totale</p>
                    </div>
                </div>
            </div>
            
            <div class="col-md-3">
                <div class="card stats-card">
                    <div class="card-body text-center">
                        <i class="fas fa-euro-sign fa-2x mb-2"></i>
                        <h4 id="totalCosts">€0</h4>
                        <p class="mb-0">Costi Totali</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- File Details -->
        <div id="fileDetails" class="row mt-4 d-none">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5><i class="fas fa-list"></i> Dettagli File</h5>
                    </div>
                    <div class="card-body">
                        <div id="fileList"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div id="actions" class="row mt-4 d-none">
            <div class="col-12 text-center">
                <a href="/export/csv" class="btn btn-success me-2">
                    <i class="fas fa-download"></i> Esporta CSV
                </a>
                <a href="/stats" class="btn btn-info me-2">
                    <i class="fas fa-chart-pie"></i> Statistiche
                </a>
                <a href="/api/results" class="btn btn-secondary">
                    <i class="fas fa-code"></i> API JSON
                </a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('extractBtn').addEventListener('click', function() {
            // Show loading spinner
            document.getElementById('loadingSpinner').classList.remove('d-none');
            document.getElementById('extractBtn').disabled = true;
            
            // Make API call
            fetch('/extract', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                }
            })
            .then(response => response.json())
            .then(data => {
                // Hide loading spinner
                document.getElementById('loadingSpinner').classList.add('d-none');
                document.getElementById('extractBtn').disabled = false;
                
                if (data.success) {
                    // Update overview
                    document.getElementById('filesProcessed').textContent = data.files_processed;
                    document.getElementById('totalMissions').textContent = data.total_missions;
                    document.getElementById('totalPersonnel').textContent = data.total_personnel.toLocaleString();
                    document.getElementById('totalCosts').textContent = '€' + data.total_costs.toLocaleString();
                    
                    // Show results
                    document.getElementById('resultsOverview').classList.remove('d-none');
                    document.getElementById('actions').classList.remove('d-none');
                    
                    // Show success message
                    alert('Estrazione completata con successo!');
                } else {
                    alert('Errore durante l\'estrazione: ' + data.error);
                }
            })
            .catch(error => {
                document.getElementById('loadingSpinner').classList.add('d-none');
                document.getElementById('extractBtn').disabled = false;
                alert('Errore di connessione: ' + error);
            });
        });
    </script>
</body>
</html>
