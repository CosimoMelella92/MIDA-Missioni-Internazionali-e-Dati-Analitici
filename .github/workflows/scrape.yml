name: Scrape & Update Data

on:
  schedule:
    # Ogni lunedì alle 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch: # Permette esecuzione manuale

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-ci.txt

      - name: Create required directories
        run: mkdir -p logs data/raw data/processed data/documents

      - name: Run scrapers
        continue-on-error: true
        run: |
          python -c "
          import logging, sys
          logging.basicConfig(level=logging.INFO, format='%(name)s - %(levelname)s - %(message)s')
          from core.scrapers import ALL_SCRAPERS
          total = 0
          failed = 0
          for cls in ALL_SCRAPERS:
              try:
                  s = cls()
                  data = s.scrape()
                  print(f'{cls.__name__}: {len(data)} missioni')
                  total += len(data)
              except Exception as e:
                  print(f'{cls.__name__}: ERRORE - {e}', file=sys.stderr)
                  failed += 1
          print(f'Totale: {total} record da {len(ALL_SCRAPERS)-failed}/{len(ALL_SCRAPERS)} scrapers')
          "

      - name: Regenerate dataset
        continue-on-error: true
        run: python -m core.aggregator

      - name: Run core tests
        continue-on-error: true
        run: |
          python -m pytest tests/test_scrapers.py tests/test_models.py tests/test_normalizer.py tests/test_aggregator.py -q --tb=short 2>&1 || true

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet data/processed/missioni_complete.csv 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit & push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/missioni_complete.csv data/raw/ logs/
          git diff --cached --quiet || git commit -m "chore(data): aggiornamento automatico dataset [skip ci]"
          git push
